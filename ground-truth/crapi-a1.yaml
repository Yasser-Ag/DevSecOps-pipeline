# =============================================================================
#  Ground truth A1 — documented application-level vulnerabilities of crAPI
#
#  Authoritative sources : docs/challenges.md, docs/challengeSolutions.md
#  Pinned commit         : b5fc307f3e5f875809b095b771108ef342a33724 (2026-09-09)
#  Compiled              : 2026-09-11
#
#  Fields
#    id                 stable identifier used in recall computations
#    title              official wording (docs/challenges.md)
#    source_line        line number in docs/challenges.md (traceability)
#    owasp_api          OWASP API Security Top 10 (2023) / OWASP LLM Top 10 (2025)
#    cwe                expected CWE
#    service            crAPI microservice concerned
#    service_evidence   confirmed  = endpoint stated in challengeSolutions.md
#                       inferred   = deduced from functional scope, not stated
#    endpoint           API path when documented, else null
#    solution_detail    full | title_only  (depth of the official solution)
#    nature             business_logic | implementation
#    detectable_by      tool families that CAN theoretically detect it
#                       (sast | sca | dast | secrets | iac | image | none)
#    rationale          justification of the detectability bound
#
#  METHODOLOGICAL NOTE
#  `detectable_by` is a theoretical UPPER BOUND, established before any
#  pipeline execution (pre-registered). It separates "the pipeline missed it"
#  from "no tool of that family can find it". It is never revised after
#  observing results.
# =============================================================================

target: crAPI
commit: b5fc307f3e5f875809b095b771108ef342a33724
commit_date: 2026-09-09
source_files:
  - docs/challenges.md
  - docs/challengeSolutions.md
documented_total: 18
secret_challenges_excluded: true

challenges:

  # --- BOLA ------------------------------------------------------------------
  - id: CH-01
    title: "Access details of another user's vehicle"
    source_line: 17
    owasp_api: "API1:2023 Broken Object Level Authorization"
    cwe: CWE-639
    service: identity
    service_evidence: confirmed
    endpoint: "/identity/api/v2/vehicle/<vehicleid>/location"
    solution_detail: full
    nature: business_logic
    detectable_by: [dast]
    rationale: >
      Requires two accounts and manipulation of a resource identifier at
      runtime. The exploit chains a second service (/community/api/v2/
      community/posts/recent) to obtain another user's vehicleid. No static
      analyser can infer the owner/object relation; an authenticated
      multi-user DAST can.

  - id: CH-02
    title: "Access mechanic reports of other users"
    source_line: 25
    owasp_api: "API1:2023 Broken Object Level Authorization"
    cwe: CWE-639
    service: workshop
    service_evidence: confirmed
    endpoint: "/workshop/api/merchant/contact_mechanic"
    solution_detail: full
    nature: business_logic
    detectable_by: [dast]
    rationale: >
      Same mechanism as CH-01 on an undocumented endpoint disclosed through a
      report_link field; requires a discovery phase followed by cross-identity
      response comparison.

  # --- Broken User Authentication --------------------------------------------
  - id: CH-03
    title: "Reset the password of a different user"
    source_line: 37
    owasp_api: "API2:2023 Broken Authentication"
    cwe: CWE-307
    service: identity
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: implementation
    detectable_by: [dast]
    rationale: >
      Missing rate limiting on OTP validation. Observable only through repeated
      requests; the code contains no syntactic pattern a generic SAST ruleset
      reliably flags.

  # --- Excessive Data Exposure ------------------------------------------------
  - id: CH-04
    title: "Find an API endpoint that leaks sensitive information of other users"
    source_line: 45
    owasp_api: "API3:2023 Broken Object Property Level Authorization"
    cwe: CWE-200
    service: community
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: implementation
    detectable_by: [dast]
    rationale: >
      Over-broad object serialization. A DAST can spot sensitive fields in
      responses; SAST could in principle, but requires a rule specific to the
      data model, absent from generic rulesets.

  - id: CH-05
    title: "Find an API endpoint that leaks an internal property of a video"
    source_line: 47
    owasp_api: "API3:2023 Broken Object Property Level Authorization"
    cwe: CWE-200
    service: community
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: implementation
    detectable_by: [dast]
    rationale: >
      Internal property exposed in the JSON response; detectable by response
      analysis, not by code reading without domain knowledge.

  # --- Rate Limiting ----------------------------------------------------------
  - id: CH-06
    title: "Perform a layer 7 DoS using 'contact mechanic' feature"
    source_line: 53
    owasp_api: "API4:2023 Unrestricted Resource Consumption"
    cwe: CWE-770
    service: workshop
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: implementation
    detectable_by: [dast]
    rationale: >
      Missing bound on a repetition parameter. Measurable behaviourally
      (response time, load); statically invisible.

  # --- BFLA -------------------------------------------------------------------
  - id: CH-07
    title: "Delete a video of another user"
    source_line: 57
    owasp_api: "API5:2023 Broken Function Level Authorization"
    cwe: CWE-285
    service: community
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: business_logic
    detectable_by: [dast]
    rationale: >
      Administrative endpoint reachable by a standard user; requires exercising
      a privileged route with a non-privileged token.

  # --- Mass Assignment --------------------------------------------------------
  - id: CH-08
    title: "Get an item for free"
    source_line: 65
    owasp_api: "API6:2023 Unrestricted Access to Sensitive Business Flows"
    cwe: CWE-915
    service: workshop
    service_evidence: confirmed
    endpoint: "/workshop/api/shop/orders"
    solution_detail: full
    nature: business_logic
    detectable_by: [dast]
    rationale: >
      Mass assignment on a price/quantity field. SAST could in theory flag an
      unrestricted binding, but the business impact is not inferable from code.

  - id: CH-09
    title: "Increase your balance by $1,000 or more"
    source_line: 72
    owasp_api: "API6:2023 Unrestricted Access to Sensitive Business Flows"
    cwe: CWE-840
    service: workshop
    service_evidence: confirmed
    endpoint: "/workshop/api/shop/orders"
    solution_detail: full
    nature: business_logic
    detectable_by: [none]
    rationale: >
      Purely arithmetic/semantic flaw (crAPI itself classifies it as business
      logic). Out of reach of any scanner: no request reveals the error without
      knowledge of the intended business rule.

  - id: CH-10
    title: "Update internal video properties"
    source_line: 76
    owasp_api: "API3:2023 Broken Object Property Level Authorization"
    cwe: CWE-915
    service: community
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: implementation
    detectable_by: [dast]
    rationale: >
      Write access to an internal property via mass assignment; depends on
      CH-05 to learn the field name (challenge chaining).

  # --- SSRF -------------------------------------------------------------------
  - id: CH-11
    title: "Make crAPI send an HTTP call to www.google.com and return the response"
    source_line: 82
    owasp_api: "API7:2023 Server Side Request Forgery"
    cwe: CWE-918
    service: workshop
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: implementation
    detectable_by: [sast, dast]
    rationale: >
      HTTP request built from user input: a source-to-sink pattern recognisable
      by SAST AND confirmable by DAST through an out-of-band callback.
      Candidate for cross-tool consensus.

  # --- NoSQL Injection --------------------------------------------------------
  - id: CH-12
    title: "Find a way to get free coupons without knowing the coupon code"
    source_line: 86
    owasp_api: "API8:2023 Security Misconfiguration"
    cwe: CWE-943
    service: community
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: implementation
    detectable_by: [sast, dast]
    rationale: >
      NoSQL (MongoDB) injection: unsanitised input concatenated into a query —
      detectable by a SAST injection rule and by a DAST payload.

  # --- SQL Injection ----------------------------------------------------------
  - id: CH-13
    title: "Redeem a coupon that has already been claimed by modifying the database"
    source_line: 90
    owasp_api: "API8:2023 Security Misconfiguration"
    cwe: CWE-89
    service: workshop
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: implementation
    detectable_by: [sast, dast]
    rationale: >
      Classic SQL injection (PostgreSQL). Most favourable case for both
      families: clear static pattern and standard injection payload.

  # --- Unauthenticated Access -------------------------------------------------
  - id: CH-14
    title: "Find an endpoint that does not perform authentication checks"
    source_line: 94
    owasp_api: "API2:2023 Broken Authentication"
    cwe: CWE-306
    service: identity
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: implementation
    detectable_by: [dast]
    rationale: >
      Route without authentication middleware. A SAST could detect it with a
      framework-specific rule; in practice an unauthenticated request is the
      only reliable method.

  # --- JWT --------------------------------------------------------------------
  - id: CH-15
    title: "Find a way to forge valid JWT Tokens"
    source_line: 98
    owasp_api: "API2:2023 Broken Authentication"
    cwe: CWE-347
    service: identity
    service_evidence: inferred
    endpoint: null
    solution_detail: full
    nature: implementation
    detectable_by: [sast, dast]
    rationale: >
      Faulty signature validation (uncontrolled external JWKS). Detectable by a
      SAST rule on token verification and by DAST token forgery if an
      attacker-controlled JWKS is accepted.

  # --- LLM (OWASP LLM Top 10 2025) --------------------------------------------
  - id: CH-16
    title: "Use the chatbot to do a successful prompt injection"
    source_line: 104
    owasp_api: "LLM01:2025 Prompt Injection"
    cwe: CWE-1427
    service: chatbot
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: implementation
    detectable_by: [dast]
    rationale: >
      Instruction injection through the chatbot input. No general-purpose
      static tool ships a rule for this pattern; detection requires behavioural
      testing with adversarial payloads.

  - id: CH-17
    title: "Extract the credentials of another user using chatbot"
    source_line: 108
    owasp_api: "LLM02:2025 Sensitive Information Disclosure"
    cwe: CWE-200
    service: chatbot
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: implementation
    detectable_by: [dast]
    rationale: >
      Data leakage through model context. Requires observing LLM responses;
      out of reach of static analysis.

  - id: CH-18
    title: "Make the chatbot do an action on behalf of another user"
    source_line: 112
    owasp_api: "LLM06:2025 Excessive Agency"
    cwe: CWE-862
    service: chatbot
    service_evidence: inferred
    endpoint: null
    solution_detail: title_only
    nature: business_logic
    detectable_by: [dast]
    rationale: >
      The model holds tools without per-identity authorization checks.
      Detectable only by exercising the agent with two distinct identities.

# =============================================================================
#  Pre-registered theoretical upper bounds (before any execution)
# =============================================================================
theoretical_upper_bound:
  sast:    4      # CH-11, CH-12, CH-13, CH-15
  sca:     0      # no challenge is a dependency CVE
  secrets: 0      # no challenge is a committed secret
  dast:    17     # all except CH-09
  none:    1      # CH-09 (pure arithmetic business logic)

# =============================================================================
#  Documentation gaps observed in the authoritative sources
#  (reported as-is; they bound what can be asserted about this ground truth)
# =============================================================================
documentation_gaps:
  - id: GAP-1
    description: >
      Only 5 of 18 challenges (CH-01, CH-02, CH-08, CH-09, CH-15) carry a
      "Detailed solution" section in challengeSolutions.md. The remaining 13
      are title-only, so their service attribution is inferred from functional
      scope rather than stated by the project.
  - id: GAP-2
    description: >
      challenges.md announces 3 secret challenges while challengeSolutions.md
      announces 2. Secret challenges are excluded from all computations.
  - id: GAP-3
    description: >
      challengeSolutions.md stops at CH-15; the three LLM challenges (CH-16 to
      CH-18) present in challenges.md have no corresponding solution section.
  - id: GAP-4
    description: >
      Neither source file references source-code paths. Ground-truth matching
      is therefore performed on CWE and service, not on file location.

