name: devsecops-pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  LAB: /opt/devsecops-lab
  TARGET: app/crAPI
  PATH: /home/lab/.local/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  scan:
    runs-on: [self-hosted, devsecops]
    steps:

      - name: Prepare run directory
        run: |
          RUN_DIR=$LAB/results/run-${{ github.run_number }}
          mkdir -p $RUN_DIR
          echo "RUN_DIR=$RUN_DIR" >> $GITHUB_ENV
          echo "target=$TARGET" > $RUN_DIR/meta.txt
          echo "commit=${{ github.sha }}" >> $RUN_DIR/meta.txt
          date -u +%FT%TZ >> $RUN_DIR/meta.txt

      - name: "Stage 1 — SAST (Semgrep)"
        run: |
          START=$(date +%s.%N)
          semgrep scan --config p/owasp-top-ten --config p/secrets \
            --json --output $RUN_DIR/01-sast-semgrep.json \
            --metrics off --quiet $LAB/$TARGET || true
          END=$(date +%s.%N)
          echo "sast=$(echo "$END - $START" | bc)" >> $RUN_DIR/timing.txt
          echo "SAST findings: $(jq '.results | length' $RUN_DIR/01-sast-semgrep.json)"

      - name: "Stage 2 — SCA (Trivy fs)"
        run: |
          START=$(date +%s.%N)
          trivy fs --scanners vuln --format json \
            --output $RUN_DIR/02-sca-trivy.json $LAB/$TARGET || true
          END=$(date +%s.%N)
          echo "sca=$(echo "$END - $START" | bc)" >> $RUN_DIR/timing.txt
          echo "SCA findings: $(jq '[.Results[]?.Vulnerabilities[]?] | length' $RUN_DIR/02-sca-trivy.json)"

      - name: "Stage 3 — Secrets (gitleaks)"
        run: |
          START=$(date +%s.%N)
          gitleaks detect --source $LAB/$TARGET --no-git \
            --report-format json --report-path $RUN_DIR/03-secrets-gitleaks.json \
            --exit-code 0
          END=$(date +%s.%N)
          echo "secrets=$(echo "$END - $START" | bc)" >> $RUN_DIR/timing.txt
          echo "Secrets findings: $(jq 'length' $RUN_DIR/03-secrets-gitleaks.json 2>/dev/null || echo 0)"

      - name: Fetch pipeline code
        run: |
          rm -rf $RUNNER_TEMP/repo
          git clone --depth 1 https://github.com/Yasser-Ag/DevSecOps-pipeline.git $RUNNER_TEMP/repo

      - name: "Stage 7 — Normalize (CWE)"
        run: |
          START=$(date +%s.%N)
          python3 $RUNNER_TEMP/repo/pipeline/normalize.py $RUN_DIR --lab $LAB
          END=$(date +%s.%N)
          echo "normalize=$(echo "$END - $START" | bc)" >> $RUN_DIR/timing.txt

      - name: Summary
        run: |
          S=$RUN_DIR/summary.json
          {
            echo "## Run ${{ github.run_number }} — $(jq -r .target $S)"
            echo "**$(jq -r .raw_total $S) findings bruts → $(jq -r .dedup_total $S) après normalisation** ($(jq -r .multi_tool $S) multi-outils, $(jq -r .no_cwe $S) sans CWE)"
            echo ''
            echo '| Outil | Findings |'; echo '|---|---|'
            jq -r '.raw_by_tool | to_entries[] | "| \(.key) | \(.value) |"' $S
            echo ''
            echo '| Sévérité | Nb |'; echo '|---|---|'
            jq -r '.by_severity | to_entries[] | "| \(.key) | \(.value) |"' $S
            echo ''
            echo '| Top CWE | Nb |'; echo '|---|---|'
            jq -r '.by_cwe | to_entries[:10][] | "| \(.key) | \(.value) |"' $S
            echo ''
            echo '```'; cat $RUN_DIR/timing.txt; echo '```'
          } >> $GITHUB_STEP_SUMMARY
