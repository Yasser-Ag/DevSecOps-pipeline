name: devsecops-pipeline

on:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: "cold (purge tool caches) or warm (nominal)"
        type: choice
        options: [warm, cold]
        default: warm
      target:
        description: "target to scan (path relative to /opt/devsecops-lab)"
        default: app/crAPI
  push:
    branches: [main]

env:
  LAB: /opt/devsecops-lab
  PATH: /home/lab/.local/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  scan:
    runs-on: [self-hosted, devsecops]
    steps:

      - name: Resolve run parameters
        run: |
          echo "TARGET=${{ inputs.target || 'app/crAPI' }}" >> $GITHUB_ENV
          echo "CACHE_MODE=${{ inputs.cache_mode || 'warm' }}" >> $GITHUB_ENV

      - name: Fetch pipeline code
        run: |
          rm -rf $RUNNER_TEMP/repo
          git clone --depth 1 https://github.com/Yasser-Ag/DevSecOps-pipeline.git $RUNNER_TEMP/repo

      - name: Verify tool versions against lockfile
        run: |
          {
            echo "semgrep=$(semgrep --version)"
            echo "trivy=$(trivy --version | head -1 | awk '{print $2}')"
            echo "gitleaks=$(gitleaks version)"
            echo "checkov=$(checkov --version)"
            echo "nuclei=$(nuclei -version 2>&1 | grep -o 'v[0-9.]*' | head -1)"
          } > $RUNNER_TEMP/versions.observed
          if ! diff -u $RUNNER_TEMP/repo/pipeline/versions.lock $RUNNER_TEMP/versions.observed; then
            echo "::error::Tool versions drifted from versions.lock — results are not comparable to previous runs."
            exit 1
          fi
          echo "Versions match lockfile."

      - name: Prepare run directory
        run: |
          RUN_DIR=$LAB/results/run-${{ github.run_number }}
          mkdir -p $RUN_DIR
          echo "RUN_DIR=$RUN_DIR" >> $GITHUB_ENV
          {
            echo "target=$TARGET"
            echo "commit_pipeline=${{ github.sha }}"
            echo "commit_target=$(git -C $LAB/$TARGET rev-parse HEAD)"
            echo "cache_mode=$CACHE_MODE"
            echo "run_number=${{ github.run_number }}"
            echo "started_at=$(date -u +%FT%TZ)"
          } > $RUN_DIR/meta.txt
          cp $RUNNER_TEMP/versions.observed $RUN_DIR/versions.txt

      - name: Apply cache policy
        run: |
          if [ "$CACHE_MODE" = "cold" ]; then
            trivy clean --all || true
            rm -rf ~/.semgrep || true
            echo "Caches purged (cold run)."
          else
            echo "Caches preserved (warm run)."
          fi

      - name: "Stage 1 — SAST (Semgrep)"
        run: |
          START=$(date +%s.%N)
          semgrep scan --config p/owasp-top-ten --config p/secrets \
            --json --output $RUN_DIR/01-sast-semgrep.json \
            --metrics off --quiet $LAB/$TARGET || true
          echo "sast=$(echo "$(date +%s.%N) - $START" | bc)" >> $RUN_DIR/timing.txt

      - name: "Stage 2 — SCA (Trivy fs)"
        run: |
          START=$(date +%s.%N)
          trivy fs --scanners vuln --format json \
            --output $RUN_DIR/02-sca-trivy.json $LAB/$TARGET || true
          echo "sca=$(echo "$(date +%s.%N) - $START" | bc)" >> $RUN_DIR/timing.txt

      - name: "Stage 3 — Secrets (gitleaks)"
        run: |
          START=$(date +%s.%N)
          gitleaks detect --source $LAB/$TARGET --no-git \
            --report-format json --report-path $RUN_DIR/03-secrets-gitleaks.json \
            --exit-code 0
          echo "secrets=$(echo "$(date +%s.%N) - $START" | bc)" >> $RUN_DIR/timing.txt

      - name: "Stage 4 — IaC / Config (checkov + Trivy config)"
        run: |
          START=$(date +%s.%N)
          checkov --directory $LAB/$TARGET \
            --framework dockerfile,kubernetes,github_actions,terraform,secrets \
            --output json --quiet --compact --soft-fail \
            > $RUN_DIR/04a-iac-checkov.json 2>/dev/null || true
          trivy config --format json \
            --output $RUN_DIR/04b-config-trivy.json $LAB/$TARGET || true
          echo "iac=$(echo "$(date +%s.%N) - $START" | bc)" >> $RUN_DIR/timing.txt

      - name: "Stage 5 — Image (Trivy image)"
        run: |
          START=$(date +%s.%N)
          IMAGES=$(docker ps --filter "name=crapi" --format '{{.Image}}' | sort -u)
          if [ -n "$IMAGES" ]; then
            echo "$IMAGES" > $RUN_DIR/05-images.txt
            for IMG in $IMAGES; do
              SAFE=$(echo "$IMG" | tr '/:' '__')
              trivy image --scanners vuln --format json \
                --output $RUN_DIR/05-image-$SAFE.json "$IMG" || true
            done
          else
            : > $RUN_DIR/05-images.txt
            echo "No running target images — stage 5 skipped (target not deployed)."
          fi
          echo "image=$(echo "$(date +%s.%N) - $START" | bc)" >> $RUN_DIR/timing.txt

      - name: Record vulnerability database state
        run: |
          trivy version --format json > $RUN_DIR/trivy-db.json 2>/dev/null || echo '{}' > $RUN_DIR/trivy-db.json
          {
            echo "trivy_vulndb_updated_at=$(jq -r '.VulnerabilityDB.UpdatedAt // "unknown"' $RUN_DIR/trivy-db.json)"
            echo "trivy_vulndb_downloaded_at=$(jq -r '.VulnerabilityDB.DownloadedAt // "unknown"' $RUN_DIR/trivy-db.json)"
            echo "trivy_checkbundle_digest=$(jq -r '.CheckBundle.Digest // "unknown"' $RUN_DIR/trivy-db.json)"
          } >> $RUN_DIR/meta.txt
          cat $RUN_DIR/meta.txt

      - name: "Stage 7 — Normalize (CWE)"
        run: |
          START=$(date +%s.%N)
          python3 $RUNNER_TEMP/repo/pipeline/normalize.py $RUN_DIR --lab $LAB
          echo "normalize=$(echo "$(date +%s.%N) - $START" | bc)" >> $RUN_DIR/timing.txt

      - name: "Evaluate against A2 ground truth"
        run: |
          python3 $RUNNER_TEMP/repo/pipeline/evaluate.py $RUN_DIR \
            --ground-truth $RUNNER_TEMP/repo/ground-truth/crapi-a2.yaml

      - name: Collect artifacts
        run: |
          mkdir -p $RUNNER_TEMP/artifacts
          cp $RUN_DIR/meta.txt $RUN_DIR/versions.txt $RUN_DIR/timing.txt \
             $RUN_DIR/trivy-db.json $RUN_DIR/summary.json $RUN_DIR/consensus.json \
             $RUN_DIR/evaluation-a2.json \
             $RUN_DIR/findings.jsonl $RUN_DIR/findings-dedup.jsonl \
             $RUNNER_TEMP/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run-${{ github.run_number }}-${{ env.CACHE_MODE }}
          path: ${{ runner.temp }}/artifacts
          retention-days: 90

      - name: Summary
        run: |
          S=$RUN_DIR/summary.json
          E=$RUN_DIR/evaluation-a2.json
          {
            echo "## Run ${{ github.run_number }} — $(jq -r .target $S) (cache: $CACHE_MODE)"
            echo "**$(jq -r .raw_total $S) raw → $(jq -r .dedup_total $S) normalized** — $(jq -r .consensus_pairs_strict $S) strict / $(jq -r .consensus_pairs_loose $S) loose cross-tool agreements, $(jq -r .no_cwe $S) without CWE"
            echo ''
            echo "Vulnerability DB published: \`$(grep trivy_vulndb_updated_at $RUN_DIR/meta.txt | cut -d= -f2)\`"
            echo ''
            echo '| Stage | Findings |'; echo '|---|---|'
            jq -r '.raw_by_stage | to_entries[] | "| \(.key) | \(.value) |"' $S
            echo ''
            echo '| Tool | Findings |'; echo '|---|---|'
            jq -r '.raw_by_tool | to_entries[] | "| \(.key) | \(.value) |"' $S
            echo ''
            echo '| Severity | Count |'; echo '|---|---|'
            jq -r '.by_severity | to_entries[] | "| \(.key) | \(.value) |"' $S
            echo ''
            echo '| Top CWE | Count |'; echo '|---|---|'
            jq -r '.by_cwe | to_entries[:10][] | "| \(.key) | \(.value) |"' $S
            echo ''
            if [ -f "$E" ]; then
              echo "### A2 ground-truth recall: $(jq -r .weaknesses_detected $E)/$(jq -r .weaknesses_total $E) weaknesses ($(jq -r '.weakness_recall * 100 | floor' $E)%)"
              echo ''
              echo '| ID | CWE | Artifacts | Findings | Tools |'; echo '|---|---|---|---|---|'
              jq -r '.per_weakness[] | "| \(.id) | \(.cwe) | \(.matched_artifacts)/\(.expected_count) | \(.findings) | \(if (.by_tool | length) > 0 then (.by_tool | join(", ")) else "-" end) |"' $E
              echo ''
              echo '| Verified-absent control | CWE | False positives |'; echo '|---|---|---|'
              jq -r '.verified_absent_checks[] | "| \(.id) \(.control) | \(.cwe) | \(.findings_on_absent_control) |"' $E
              echo ''
            fi
            echo '```'; cat $RUN_DIR/timing.txt; echo '```'
          } >> $GITHUB_STEP_SUMMARY
