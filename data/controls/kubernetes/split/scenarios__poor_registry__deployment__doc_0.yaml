apiVersion: apps/v1
kind: Deployment
metadata:
  name: poor-registry-deployment
  namespace: default
spec:
  selector:
    matchLabels:
      app: poor-registry
  template:
    metadata:
      labels:
        app: poor-registry
    spec:
      containers:
      - name: poor-registry
        image: madhuakula/k8s-goat-poor-registry
        resources:
          limits:
            memory: 50Mi
            cpu: 30m
        ports:
        - containerPort: 5000
